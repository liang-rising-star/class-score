<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/logo.ico" type="image/x-icon">
    <title>欢迎使用班级积分管理系统</title>
    <link rel="stylesheet" href="/static/css/app.css?v={{ css_version }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card auth-card--wide welcome-card">
            <div class="welcome-hero">
                <img class="welcome-logo" src="/logo.ico" alt="">
                <h1 class="welcome-title">欢迎使用班级积分管理系统</h1>
                <p class="welcome-sub">
                    打印积分卡、扫码核销、汇总统计，一套流程走完<br>
                    数据全部保存在本机，不需要联网
                </p>
            </div>

            <div class="welcome-points">
                <div class="welcome-point">
                    <span class="welcome-point__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6 9V3h12v6"></path>
                            <path d="M6 18H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"></path>
                            <path d="M6 14h12v7H6z"></path>
                        </svg>
                    </span>
                    <div>
                        <b>一键生成积分卡</b>
                        <span>条码 + 面额，A4 排版直接打印</span>
                    </div>
                </div>

                <div class="welcome-point">
                    <span class="welcome-point__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"></path>
                            <path d="M4 7v12a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7"></path>
                            <path d="M8 4v3"></path>
                            <path d="M12 4v3"></path>
                            <path d="M16 4v3"></path>
                        </svg>
                    </span>
                    <div>
                        <b>扫码核销</b>
                        <span>扫一张核销一张，重复和伪造立刻报警</span>
                    </div>
                </div>

                <div class="welcome-point">
                    <span class="welcome-point__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 3 4 6.5v5c0 4.5 3.4 8.2 8 9.5 4.6-1.3 8-5 8-9.5v-5L12 3Z"></path>
                            <path d="m9 12 2 2 4-4"></path>
                        </svg>
                    </span>
                    <div>
                        <b>数据留在本机</b>
                        <span>自动备份、可导入 2.x 旧数据</span>
                    </div>
                </div>
            </div>

            <form action="/welcome/done" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="btn btn-block welcome-cta">
                    开始体验
                </button>
            </form>

            <div class="auth-foot">首次启动需要完成两步设置，大约 1 分钟</div>
        </div>
    </div>
</body>
</html>
