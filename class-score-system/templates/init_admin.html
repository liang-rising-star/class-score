<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/logo.ico" type="image/x-icon">
    <title>初始化管理员</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-head">
                <img class="auth-logo" src="/logo.ico" alt="">
                <h1 class="auth-title">管理员初始化</h1>
                <p class="auth-sub">首次启动，请设置管理账号</p>
            </div>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            {% if notice %}
            <div class="alert alert-{{ 'success' if notice.kind == 'success' else 'error' }}">{{ notice.text }}</div>
            {% endif %}

            <form action="/init_admin" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="field">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required maxlength="32"
                           autocomplete="username" placeholder="例如 admin">
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required minlength="4"
                           autocomplete="new-password" placeholder="至少 4 位">
                    <div class="field-hint">密码以 PBKDF2 加盐哈希保存，不存明文</div>
                </div>
                <button type="submit" class="btn btn-block">创建管理员</button>
            </form>

            <div class="import-block">
                <div class="import-title">已有旧版本数据？</div>
                <p class="import-hint">从 2.x 版本导入积分记录（含已核销状态），导入后再创建管理员</p>
                <form action="/import_legacy" method="post" id="legacyForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="legacy_path" id="legacy_path" value="">
                    <button type="button" id="importLegacyBtn" class="btn btn-ghost btn-block">选择旧版安装目录并导入</button>
                </form>
            </div>

            <div class="auth-foot">{{ system_name }} · 仅首次启动需要设置</div>
        </div>
    </div>

<script>
// 桌面版里用原生文件夹选择框（DPI 正常、带本程序图标）；网页版回退到服务端对话框
(function() {
    var btn = document.getElementById('importLegacyBtn');
    var form = document.getElementById('legacyForm');
    var input = document.getElementById('legacy_path');
    if (!btn || !form || !input) return;

    function submitWith(path) {
        input.value = path || '';
        form.submit();
    }

    btn.addEventListener('click', function() {
        var bridge = window.chrome && window.chrome.webview && window.chrome.webview.hostObjects
            ? window.chrome.webview.hostObjects.desktopBridge : null;
        if (!bridge) { submitWith(''); return; }          // 网页版：交给服务端弹框

        bridge.PickFolder('选择旧版程序安装目录').then(function(path) {
            if (!path) return;                            // 用户取消：什么都不做
            submitWith(path);
        }).catch(function() { submitWith(''); });
    });
})();
</script>
</body>
</html>
