<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/logo.ico" type="image/x-icon">
    <title>{{ system_name }}</title>
    <link rel="stylesheet" href="/static/css/app.css?v={{ css_version }}">
</head>
<body>
    <div class="app-shell">
        {% set active_page = 'index' %}
        {% include "_sidebar.html" %}

    <main class="page">
        <div class="page-head">
            <h1 class="page-title">控制台</h1>
            <p class="page-desc">生成防伪积分卡，或扫码核销已发放的积分</p>
        </div>

        <div class="tile-grid">
            <a draggable="false" class="tile" href="/generate">
                <div class="tile-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                        <path d="M12 9v6M9 12h6"></path>
                    </svg>
                </div>
                <h2>生成积分</h2>
                <p>批量生成 10 位防伪编号，一键导出 A4 排版 Word，打印裁剪即用。</p>
                <span class="tile-cta">开始生成 →</span>
            </a>

            <a draggable="false" class="tile" href="/verify">
                <div class="tile-icon is-green">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 7V5a1 1 0 0 1 1-1h2M20 7V5a1 1 0 0 0-1-1h-2M4 17v2a1 1 0 0 0 1 1h2M20 17v2a1 1 0 0 1-1 1h-2"></path>
                        <path d="M8 12h8"></path>
                    </svg>
                </div>
                <h2>核销积分</h2>
                <p>扫码枪或手动录入编号，实时校验真伪并累计本次核销总额。</p>
                <span class="tile-cta">去核销 →</span>
            </a>
        </div>
    </main>

    </div>
</body>
</html>
