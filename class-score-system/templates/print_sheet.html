<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>打印预览 - {{ system_name }}</title>
<style>
    @page {
        size: A4 portrait;
        margin: 0.5cm 1cm;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        background: #fff;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        color: #000;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .sheet {
        display: grid;
        grid-template-columns: repeat({{ 3 }}, {{ column_width_cm }}cm);
        grid-auto-rows: {{ row_height_cm }}cm;
        justify-content: center;
        page-break-after: always;
        break-after: page;
    }

    .sheet:last-child { page-break-after: auto; break-after: auto; }

    .card {
        border: 1px solid #000;
        padding: 2px 4px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1px;
        overflow: hidden;
    }

    .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
    }

    .card-kind {
        font-size: 10pt;
        font-weight: 700;
        white-space: nowrap;
    }

    .card-amount {
        font-size: 9pt;
        font-weight: 700;
        border: 1px solid #000;
        border-radius: 2px;
        padding: 0 4px;
        white-space: nowrap;
    }

    .card-line {
        font-size: 9pt;
        line-height: 1.25;
        display: flex;
        justify-content: space-between;
        gap: 8px;
    }

    .card-line span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1 1 auto;
        min-width: 0;
    }

    /* 日期这种定长信息不参与压缩 */
    .card-line span + span {
        flex: 0 0 auto;
        overflow: visible;
        text-overflow: clip;
    }

    .card-barcode {
        text-align: center;
        margin: 1px 0 0;
    }

    .card-barcode img {
        width: 5cm;
        height: auto;
        display: inline-block;
    }

    .card-code {
        text-align: center;
        font-family: Consolas, "Courier New", monospace;
        font-size: 8pt;
        line-height: 1.1;
    }
</style>
</head>
<body>
{% for page in pages %}
<div class="sheet">
    {% for code in page %}
    <div class="card">
        <div class="card-head">
            <span class="card-kind">班级积分卡</span>
            <span class="card-amount">{{ amount }}分</span>
        </div>
        <div class="card-line"><span>班级：{{ class_name }}</span></div>
        <div class="card-line">
            <span>标题：{{ title }}</span>
            <span>日期：{{ issue_date }}</span>
        </div>
        <div class="card-barcode">
            <img src="/barcode/{{ code }}.png" alt="{{ code }}" draggable="false">
        </div>
        <div class="card-code">{{ code }}</div>
    </div>
    {% endfor %}
</div>
{% endfor %}
</body>
</html>
