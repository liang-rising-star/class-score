<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/logo.ico" type="image/x-icon">
    <title>系统设置</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    {% include "_header.html" %}

    <main class="page">
        <div class="page-head">
            <h1 class="page-title">系统设置</h1>
            <p class="page-desc">修改管理员口令，或把系统恢复到出厂状态</p>
        </div>

        <div class="card">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="10" width="16" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
                修改密码
            </div>
            <p class="card-sub">修改后立即生效，当前会话保持登录状态</p>

            {% if success %}
            <div class="alert alert-success">密码修改成功！</div>
            {% elif wrong_password %}
            <div class="alert alert-error">当前密码错误！</div>
            {% elif message %}
            <div class="alert alert-error">{{ message }}</div>
            {% endif %}

            <form action="/setting" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-grid">
                    <div class="field">
                        <label for="current_password">当前密码</label>
                        <input type="password" id="current_password" name="current_password" required
                               autocomplete="current-password">
                    </div>
                    <div class="field">
                        <label for="password">新密码</label>
                        <input type="password" id="password" name="password" required minlength="4"
                               autocomplete="new-password">
                        <div class="field-hint">至少 4 位，以 PBKDF2 加盐哈希保存</div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">保存</button>
                </div>
            </form>
        </div>

        <div class="danger-card">
            <h3>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 9v4M12 17h.01"></path>
                    <path d="M10.3 3.9 2.4 17a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path>
                </svg>
                危险操作
            </h3>
            <p>恢复出厂设置将清除所有积分数据、导出文件和管理员账号，系统将回到初始状态。此操作不可撤销。</p>
            <form action="/reset" method="post"
                  onsubmit="return confirm('确定要恢复出厂设置吗？所有数据将被清除，此操作不可撤销！')">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="field">
                    <label for="reset_password">请输入当前密码以确认操作</label>
                    <input type="password" id="reset_password" name="reset_password" required
                           placeholder="输入当前密码" autocomplete="current-password">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-danger">恢复出厂设置</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
