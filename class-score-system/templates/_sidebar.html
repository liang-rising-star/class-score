        <span class="brand-text">
            <span class="brand-name">{{ system_name }}</span>
            <span class="brand-sub">Class Score</span>
        </span>
    </a>

    <nav class="side-nav" id="sidebarNav">
        <span class="side-nav__label">主菜单</span>

        <a draggable="false" class="side-link {{ 'is-active' if active_page == 'index' }}" href="/index" title="控制台">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1.6"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1.6"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1.6"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1.6"></rect>
            </svg>
            <span class="side-link__text">控制台</span>
        </a>

        <a draggable="false" class="side-link {{ 'is-active' if active_page == 'generate' }}" href="/generate" title="生成积分">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                <path d="M12 9v6M9 12h6"></path>
            </svg>
            <span class="side-link__text">生成积分</span>
        </a>

        <a draggable="false" class="side-link {{ 'is-active' if active_page == 'verify' }}" href="/verify" title="核销积分">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 7V5a1 1 0 0 1 1-1h2M20 7V5a1 1 0 0 0-1-1h-2M4 17v2a1 1 0 0 0 1 1h2M20 17v2a1 1 0 0 1-1 1h-2"></path>
                <path d="M8 12h8"></path>

            <span class="side-link__text">核销积分</span>
        </a>
    </nav>

    <div class="sidebar-foot">
        <a draggable="false" class="side-link {{ 'is-active' if active_page == 'setting' }}" href="/setting" title="设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3.2"></circle>
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.11A1.7 1.7 0 0 0 15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.03a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.49.94Z"></path>

        <a draggable="false" class="side-link is-danger" href="/logout" title="退出登录" id="logoutLink">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <path d="m16 17 5-5-5-5M21 12H9"></path>
            </svg>
            <span class="side-link__text">退出登录</span>

        <button type="button" id="sidebarToggle" class="sidebar-toggle"
                aria-expanded="true" aria-controls="sidebarNav" title="收起菜单">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                <path d="M9 4v16"></path>
                <path d="m14 9-3 3 3 3"></path>
            </svg>
            <span class="sidebar-toggle__text">收起菜单</span>
        </button>
    </div>
</aside>

<!-- 退出登录确认弹窗 -->
<dialog id="logoutDialog" class="modal" aria-labelledby="logoutTitle">
    <form method="dialog" class="modal__body">
        <div class="modal__icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <path d="m16 17 5-5-5-5M21 12H9"></path>
            </svg>
        </div>
        <h3 class="modal__title" id="logoutTitle">退出登录？</h3>
        <p class="modal__text">退出后需要重新输入账号密码才能继续使用。</p>
        <div class="modal__actions">
            <button type="submit" value="cancel" class="btn btn-ghost">取消</button>
            <button type="submit" value="confirm" class="btn btn-danger">退出登录</button>
        </div>
    </form>
</dialog>

<script>
(function() {
    var KEY = 'class-score:sidebar-collapsed';
    var shell = document.querySelector('.app-shell');
    var btn = document.getElementById('sidebarToggle');
    if (!shell || !btn) return;

    function apply(collapsed) {
        shell.classList.toggle('is-collapsed', collapsed);
        btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        btn.title = collapsed ? '展开菜单' : '收起菜单';
        btn.querySelector('.sidebar-toggle__text').textContent = collapsed ? '展开菜单' : '收起菜单';
    }

    var collapsed = false;
    try { collapsed = localStorage.getItem(KEY) === '1'; } catch (e) {}
    apply(collapsed);

    btn.addEventListener('click', function() {
        var next = !shell.classList.contains('is-collapsed');
        apply(next);
        try { localStorage.setItem(KEY, next ? '1' : '0'); } catch (e) {}
    });
})();

// 退出登录：页内弹窗确认
(function() {
    var link = document.getElementById('logoutLink');
    var dialog = document.getElementById('logoutDialog');
    if (!link || !dialog) return;

    link.addEventListener('click', function(e) {
        e.preventDefault();
        if (typeof dialog.showModal === 'function') {
            dialog.showModal();
        } else if (confirm('确定要退出登录吗？')) {
            location.href = link.getAttribute('href');
        }
    });

    // 点遮罩层空白处 = 取消（Esc 由 <dialog> 原生处理）
    dialog.addEventListener('click', function(e) {
        if (e.target === dialog) dialog.close('cancel');
    });

    // <form method="dialog"> 点按钮即关闭，returnValue 记录点的是哪个
    dialog.addEventListener('close', function() {
        if (dialog.returnValue === 'confirm') {
            location.href = link.getAttribute('href');
        }
    });
})();
</script>
