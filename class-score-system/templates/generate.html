<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/logo.ico" type="image/x-icon">
    <title>生成积分</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    {% include "_header.html" %}

    <main class="page">
        <div class="page-head">
            <h1 class="page-title">生成积分</h1>
            <p class="page-desc">每张卡生成独立防伪编号，导出后可直接打印裁剪</p>
        </div>

        <div class="card">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                    <path d="M12 9v6M9 12h6"></path>
                </svg>
                批量生成
            </div>
            <p class="card-sub">A4 纸每页 3 列 × 7 行，共 21 张卡片</p>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form action="/generate" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-grid">
                    <div class="field">
                        <label for="class_name">班级名称</label>
                        <input type="text" id="class_name" name="class_name" required
                               maxlength="40" placeholder="例如 高三(1)班">
                    </div>
                    <div class="field">
                        <label for="title">积分卡标题</label>
                        <input type="text" id="title" name="title" required
                               maxlength="40" placeholder="例如 期中学习奖励">
                    </div>
                    <div class="field">
                        <label for="amount">单张面额（分）</label>
                        <input type="number" id="amount" name="amount" required min="1" step="1"
                               placeholder="例如 5">
                    </div>
                    <div class="field">
                        <label for="quantity">批量生成数量</label>
                        <input type="number" id="quantity" name="quantity" required min="1" max="500" step="1"
                               placeholder="1 - 500">
                        <div class="field-hint">单次上限 500 张</div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">生成并导出</button>
                    <a class="btn btn-ghost" href="/index">返回控制台</a>
                </div>
            </form>

            {% if success %}
            <div class="success-panel">
                <h3>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 6 9 17l-5-5"></path>
                    </svg>
                    生成成功
                </h3>
                <p>已生成 {{ quantity }} 张积分卡并导出 Word 文档</p>
                <div class="form-actions">
                    <a href="/download/{{ filename }}" class="btn btn-success">下载 Word 文档</a>
                    <span class="file-chip">{{ filename }}</span>
                </div>
            </div>
            {% endif %}
        </div>
    </main>
</body>
</html>
